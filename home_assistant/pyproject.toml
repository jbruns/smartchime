# Tests for the Home Assistant blueprints and dashboard. A separate project from
# the Pi application: it needs the Python version Home Assistant runs on.
[project]
name = "smartchime-home-assistant"
version = "0.1.0"
description = "Smartchime's Home Assistant blueprints, dashboard and theme"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Pinned to the Home Assistant release running live, so tests exercise the same core.
  "pytest-homeassistant-custom-component==0.13.357",
  "jsonschema~=4.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120
