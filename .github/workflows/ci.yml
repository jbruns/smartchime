name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The Pi jobs run on Python 3.13, the Pi's Debian Python. Move it only when DietPi/Debian moves;
# renovate.json stops Renovate from bumping it.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git tags
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git tags
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -m "not hardware" --cov --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # The Home Assistant tests, on the pinned phcc. See docs/ci.md in jbruns/ha-elevations.
  ha-tests:
    name: HA tests
    uses: jbruns/ha-elevations/.github/workflows/ha-tests.yml@main
    with:
      working-directory: home_assistant
